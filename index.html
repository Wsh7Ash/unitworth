<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>unitworth — true unit price comparison</title>
  <meta name="description" content="Compare real unit prices across pack sizes locally in your browser. No server, no tracking.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>unitworth</h1>
      <p class="tagline">Which package actually costs least per unit? Paste options, get the answer. 100% local.</p>
    </header>

    <section class="toolbar" aria-label="table actions">
      <button id="add-row" type="button">+ Add row</button>
      <button id="load-example" type="button">Load example</button>
      <button id="copy-tsv" type="button">Copy as TSV</button>
      <button id="clear" type="button">Clear</button>
    </section>

    <section aria-label="comparison table">
      <table id="table">
        <thead>
          <tr>
            <th>Label</th>
            <th>Packs</th>
            <th>Size</th>
            <th>Unit</th>
            <th>Price</th>
            <th>Per unit</th>
            <th aria-label="delete"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <section class="output" aria-label="results">
      <h2>Ranking <span class="hint">(cheapest per unit first, per family)</span></h2>
      <pre id="ranking" aria-live="polite"></pre>
      <p id="insight" class="insight" aria-live="polite"></p>
    </section>

    <footer>
      <p>No network. No storage. No third-party code. View source: it's four files.</p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
